# V2 review candidate; no activation authority
schema_version: 2
application:
  name: xmas-list
  kind: web
  display_name: "Xmas List"
  group: "Open"
source:
  branch: main
  repository: "zageabb/XmasList"
builds:
  - name: build
    toolchain: python
    working_dir: "."
    commands:
      - ["python","-m","pip","install","-r","requirements.txt"]
services:
  - name: web
    role: web
    runtime: python
    runtime_version: "3.10.12"
    working_dir: "."
    entrypoint: ["gunicorn","--workers","1","--timeout","180","--bind","0.0.0.0:5065","wsgi:app"]
    port: 5065
    health:
      type: http
      path: "/health"
    restart: on-failure
    required_builds: [build]
proxy:
  enabled: true
  upstream: web
  canonical_path: /apps/xmas-list/
  authentication: uda
environment:
  required: ["DATABASE_URL","UDA_AUTH_ENABLED","UDA_REQUIRED_GROUP","UDA_TRUSTED_PROXY_IPS","UDA_USER_ALIASES","UPLOAD_FOLDER"]
deployment:
  strategy: systemd
  approval: explicit
  auto_update: false
  rollback: true
  github_reporting: false
